<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Changer</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#e8eaf0; max-width:640px; margin:0 auto; padding:20px; }
  h1 { font-size:1.3rem; }
  .row { display:flex; gap:10px; align-items:center; margin:14px 0; flex-wrap:wrap; }
  button, select { font-size:1rem; padding:10px 14px; border-radius:10px; border:1px solid #2c313c; background:#1b1f28; color:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #listenBtn { width:100%; padding:20px; font-size:1.2rem; background:#2a5bd7; border:none; }
  #listenBtn.on { background:#c0392b; }
  .seg button.active { background:#2a5bd7; border-color:#2a5bd7; }
  textarea { width:100%; min-height:110px; font-size:1rem; padding:10px; border-radius:10px; border:1px solid #2c313c; background:#151820; color:inherit; box-sizing:border-box; }
  #status { font-size:.9rem; opacity:.8; min-height:1.2em; }
  label { font-size:.9rem; opacity:.8; }
</style>
</head>
<body>
<h1>Voice Changer</h1>

<div class="row seg" id="voiceSwitch">
  <button data-voice="af_heart" class="active">US voice</button>
  <button data-voice="bf_emma">UK voice</button>
</div>

<button id="listenBtn" disabled>Loading voice model…</button>
<p id="status"></p>

<label for="heard">What Chrome heard</label>
<textarea id="heard" placeholder="Your words appear here as you speak…"></textarea>

<div class="row">
  <button id="speakBtn" disabled>Speak this text</button>
  <button id="saveBtn" disabled>Save as audio clip</button>
</div>

<div class="row">
  <label for="outSel">Output device</label>
  <select id="outSel"></select>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-accent="us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice relay: speak, hear it in a US or UK voice</title>
  <meta name="description" content="Speak into your microphone and hear your words back in a natural US or UK voice. Runs in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Voice relay</h1>
      <p class="sub">Speak in your own voice. Everyone else hears a natural US or UK voice.</p>
    </header>

    <section aria-label="Accent">
      <div class="accent" role="group" aria-label="Choose accent">
        <button type="button" data-accent="us" aria-pressed="true">US</button>
        <button type="button" data-accent="uk" aria-pressed="false">UK</button>
      </div>
      <label class="field">
        <span>Voice</span>
        <select id="voice"></select>
      </label>
    </section>

    <button id="go" type="button" class="primary">Load voices (about 80 MB, once)</button>
    <progress id="prog" hidden></progress>
    <p id="status" role="status" aria-live="polite">Press the button to download the voices. After the first time they are saved in your browser.</p>

    <section aria-label="What the page heard">
      <h2>Hearing you <span id="lag" class="lag"></span></h2>
      <p id="interim" class="interim">Nothing yet.</p>
    </section>

    <section aria-label="What was spoken">
      <h2>Spoken out loud</h2>
      <ol id="log" class="log"></ol>
    </section>

    <section aria-label="Type a line">
      <form id="typedForm" class="type">
        <input id="typed" type="text" placeholder="Or type a line and press Enter" autocomplete="off" />
        <button type="submit">Speak</button>
      </form>
    </section>

    <details open>
      <summary>Settings</summary>
      <div class="settings">
        <label class="field">
          <span>Language you speak</span>
          <select id="lang">
            <option value="en-NG">English (Nigeria)</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
          </select>
        </label>
        <label class="field">
          <span>Output device (choose the virtual cable for calls)</span>
          <select id="sink"><option value="">Default speakers</option></select>
        </label>
        <label class="field">
          <span>Speed <output id="speedOut">1.0</output></span>
          <input id="speed" type="range" min="0.8" max="1.3" step="0.05" value="1" />
        </label>
        <label class="field">
          <span>Pause before speaking <output id="pauseOut">650</output> ms</span>
          <input id="pause" type="range" min="350" max="1200" step="50" value="650" />
        </label>
        <label class="check">
          <input id="monitor" type="checkbox" />
          <span>Also let me hear it on my own speakers (use earphones to avoid echo)</span>
        </label>
        <div class="row">
          <button id="test" type="button">Test voice</button>
          <button id="save" type="button">Save as audio clip</button>
        </div>
      </div>
    </details>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
